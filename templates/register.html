<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PT Web Lab - Register</title>
</head>
<body>
    <h1>Create an account</h1>

    {% if created %}
        <p role="status">Account created successfully.</p>
    {% endif %}

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
        <p>
            <label for="username">Username</label><br>
            <input id="username" name="username" type="text"
                   value="{{ username }}" required
                   minlength="3" maxlength="32"
                   pattern="[A-Za-z0-9_]{3,32}"
                   autocomplete="username">
        </p>

        <p>
            <label for="password">Password (15-128 characters)</label><br>
            <input id="password" name="password" type="password"
                   required minlength="15" maxlength="128"
                   autocomplete="new-password">
        </p>

        <button type="submit">Register</button>
    </form>
    </form>
    <p><a href="{{ url_for('auth.login') }}">Already registered? Log in</a></p>
</body>
</html>
</body>
</html>
